name: pull request labeler
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
      with:
        sync-labels: true
